[project]
name = "panda"
version = "0.1.0"
description = "A modular 3D game framework built on Panda3D and Bullet physics"
requires-python = ">=3.12"
dependencies = [
    "Panda3D==1.10.16",
    "panda3d-gltf==1.3.0",
    "panda3d-simplepbr==0.13.1",
    "anyio==4.12.1",
    "typing_extensions==4.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
    "watchfiles==1.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests/terminal"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test*"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning", "error::PendingDeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    # Module-level dataclass defaults via field(default_factory=...) used where needed
    "RUF009",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["Vec3"]

[tool.ruff.format]
docstring-code-format = true